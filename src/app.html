<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />

		<!-- PWA Meta Tags -->
		<meta name="description" content="Coordinate Rock for People 2026 festival plans with your friend group" />
		<meta name="theme-color" content="#8b5cf6" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="RFP Squad" />

		<!-- Manifest -->
		<link rel="manifest" href="/manifest.json" />

		<!-- Icons -->
		<link rel="icon" href="/favicon.ico" />
		<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
		<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
		<link rel="apple-touch-icon" href="/icon-192.png" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>

		<!-- Service Worker Registration -->
		<script>
			if ('serviceWorker' in navigator) {
				window.addEventListener('load', () => {
					navigator.serviceWorker.register('/service-worker.js').catch(() => {
						// Silent fail - PWA features won't work but app still functions
					});
				});
			}
		</script>
	</body>
</html>
